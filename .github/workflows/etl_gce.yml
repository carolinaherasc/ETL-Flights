name: Run ETL on GitHub Actions with SQL Tunnel

on:
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas numpy sqlalchemy psycopg2-binary git+https://github.com/openskynetwork/opensky-api.git#subdirectory=python

      - name: Prepare credentials and data directory
        env:
          OPENSKY_CREDENTIALS: ${{ secrets.OPENSKY_CREDENTIALS }}
        run: |
          mkdir -p data
          printf '%s' "$OPENSKY_CREDENTIALS" > src/credentials.json

      - name: Open SSH tunnel to PostgreSQL and run ETL
        env:
          GCE_SSH_KEY: ${{ secrets.GCE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$GCE_SSH_KEY" > ~/.ssh/gce_key
          chmod 600 ~/.ssh/gce_key
          ssh -f -N -o StrictHostKeyChecking=no -i ~/.ssh/gce_key -L 5432:localhost:5432 "${{ secrets.GCE_USER }}@${{ secrets.GCE_IP }}"
          python src/flights.py